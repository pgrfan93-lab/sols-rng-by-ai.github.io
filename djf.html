<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol's RNG: Biome Info Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --font: 'Rajdhani', sans-serif;
            --aura-color: #5555ff;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: white;
            font-family: var(--font);
            overflow: hidden;
            user-select: none;
        }

        /* --- BACKGROUND --- */
        .bg-stars {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 2px);
            background-size: 550px 550px, 350px 350px; 
            background-position: 0 0, 40 60;
            z-index: -1;
            opacity: 0.5;
            transition: filter 1s;
        }

        /* --- CUTSCENE --- */
        #cutscene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; 
            display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }

        .star-container {
            position: relative; width: 0; height: 0;
            display: flex; justify-content: center; align-items: center;
            animation: rotateStar 8s linear infinite;
        }

        .spike {
            position: absolute; background: white; border-radius: 50%;
            box-shadow: 0 0 20px var(--aura-color), 0 0 40px var(--aura-color);
            opacity: 0;
        }

        .spike.vertical { width: 8px; height: 300px; animation: appearVert 6s ease-out forwards; }
        .spike.horizontal { width: 300px; height: 8px; animation: appearHoriz 6s ease-out forwards; }
        .spike.diag-1 { width: 4px; height: 120px; animation: appearD1 6s ease-out forwards; }
        .spike.diag-2 { width: 4px; height: 120px; animation: appearD2 6s ease-out forwards; }
        .core-glow {
            position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%;
            box-shadow: 0 0 30px 10px white, 0 0 60px 30px var(--aura-color), 0 0 100px 60px var(--aura-color);
            animation: corePulse 2s infinite alternate;
        }

        #cutscene-text {
            position: absolute; bottom: 20%; font-size: 30px; letter-spacing: 15px;
            text-transform: uppercase; font-weight: 800; text-shadow: 0 0 10px white;
            opacity: 0; animation: fadeInText 1s forwards 1s;
        }

        .breakthrough-anim {
            color: #ff0000 !important;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #fff !important;
            animation: glitchText 0.2s infinite !important;
            font-size: 40px !important;
        }
        @keyframes glitchText {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .flash-bang {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none;
        }
        .flash-active { animation: flashAnim 0.5s forwards; }

        @keyframes rotateStar { 0% { transform: rotate(0deg) scale(0.8); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(0.8); } }
        @keyframes appearVert { 0% { height: 0; opacity:0; } 20% { height: 400px; opacity:1; } 100% { height: 300px; opacity:1; } }
        @keyframes appearHoriz { 0% { width: 0; opacity:0; } 20% { width: 400px; opacity:1; } 100% { width: 300px; opacity:1; } }
        @keyframes appearD1 { 0% { height: 0; opacity:0; transform: rotate(45deg); } 100% { height: 150px; opacity:0.8; transform: rotate(45deg); } }
        @keyframes appearD2 { 0% { height: 0; opacity:0; transform: rotate(-45deg); } 100% { height: 150px; opacity:0.8; transform: rotate(-45deg); } }
        @keyframes corePulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.5); opacity: 1; } }
        @keyframes fadeInText { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes flashAnim { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        /* --- HUD --- */
        #hud {
            position: relative; width: 100%; height: 100%;
            display: grid;
            grid-template-rows: 60px 1fr 100px;
            grid-template-columns: 250px 1fr 250px;
            padding: 20px; box-sizing: border-box;
        }

        .sidebar { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .menu-btn {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 15px; font-family: var(--font); font-size: 18px; 
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.2s; text-align: left;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .menu-btn:hover { background: white; color: black; padding-left: 25px; }

        .center-stage { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        #aura-name { font-size: 80px; font-weight: 800; text-transform: uppercase; margin: 0; line-height: 1; letter-spacing: 3px; transition: color 0.3s; }
        #aura-chance { font-size: 24px; color: #aaa; margin-top: 10px; font-weight: 500; background: rgba(0,0,0,0.5); padding: 5px 20px; border-radius: 20px; }
        
        #biome-wrapper {
            margin-top: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4);
            padding: 5px 15px; border-radius: 4px; display: flex; align-items: center; gap: 10px;
        }
        #biome-name { font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .controls { grid-row: 3; grid-column: 2; display: flex; gap: 20px; justify-content: center; align-items: flex-start; }
        .roll-btn { background: black; color: white; border: 2px solid white; padding: 15px 50px; font-size: 24px; font-weight: 800; font-family: var(--font); text-transform: uppercase; cursor: pointer; transition: 0.1s; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .roll-btn:hover { background: white; color: black; box-shadow: 0 0 30px white; }
        .roll-btn:active { transform: scale(0.95); }
        .auto-btn { background: transparent; color: #aaa; border: 2px solid #555; padding: 15px 30px; font-size: 18px; font-weight: 700; font-family: var(--font); cursor: pointer; }
        .auto-btn.active { border-color: #00ff00; color: #00ff00; box-shadow: 0 0 15px #00ff00; }

        .stats-panel { grid-row: 3; grid-column: 1; display: flex; flex-direction: column; justify-content: flex-end; font-size: 18px; gap: 5px; color: #ddd; }
        .stats-right { grid-row: 3; grid-column: 3; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; font-size: 18px; gap: 5px; }
        .val { font-weight: bold; color: white; }
        .gold { color: #ffd700; }

        /* MODALS */
        .modal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal { background: #0f0f0f; border: 1px solid #333; width: 850px; height: 650px; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 8px; }
        .modal-header { background: #151515; padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
        .close-btn { background: #ff4757; border: none; color: white; width: 35px; height: 35px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .close-btn:hover { background: #ff6b81; }
        .modal-body { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .modal-body::-webkit-scrollbar { width: 8px; }
        .modal-body::-webkit-scrollbar-track { background: #111; }
        .modal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        /* BIOME INFO BTN */
        #btn-biome-info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00b0ff;
            color: #00b0ff;
            padding: 10px 15px;
            font-family: var(--font);
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            transition: 0.2s;
        }
        #btn-biome-info:hover { background: #00b0ff; color: black; }

        /* BIOME LIST IN MODAL */
        .biome-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .biome-card {
            background: #1a1a1a; border: 1px solid #444; padding: 15px; border-radius: 8px;
        }
        .biome-card h3 { margin: 0 0 10px 0; color: white; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .buff-item { font-size: 14px; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .buff-aura { color: #aaa; }
        .buff-val { color: #4f4; font-weight: bold; }

        /* CRAFT & INV STYLES */
        .craft-row { display: flex; background: linear-gradient(90deg, #111, #1a1a1a); border: 1px solid #333; border-radius: 8px; padding: 15px; align-items: center; gap: 20px; }
        .craft-icon { font-size: 40px; width: 60px; height: 60px; background: #222; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #555; }
        .craft-info { flex-grow: 1; }
        .craft-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .craft-buff { color: gold; font-size: 14px; margin-bottom: 5px; }
        .craft-reqs { display: flex; gap: 10px; flex-wrap: wrap; }
        .req-chip { background: #000; padding: 5px 10px; border-radius: 4px; font-size: 12px; border: 1px solid #444; }
        .req-ok { color: #4f4; border-color: #4f4; }
        .req-no { color: #f44; border-color: #f44; }
        .craft-btn { background: #eee; color: #000; border: none; padding: 10px 20px; font-weight: bold; font-family: var(--font); cursor: pointer; text-transform: uppercase; border-radius: 4px; transition: 0.2s; }
        .craft-btn:hover:not(:disabled) { background: #fff; box-shadow: 0 0 10px white; }
        .craft-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .craft-owned { color: #4f4; font-weight: bold; text-transform: uppercase; }

        .inv-item { display: inline-flex; flex-direction: column; align-items: center; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; width: 200px; margin: 10px; position: relative; }
        .inv-item.legendary { border: 1px solid gold; box-shadow: 0 0 10px rgba(255,215,0,0.2); }
        .inv-item.mythical { background: linear-gradient(135deg, #000000, #240046); border: 1px solid #9400d3; box-shadow: 0 0 10px #4b0082; animation: oblivionPulse 4s infinite alternate; }
        @keyframes oblivionPulse { 0% { box-shadow: 0 0 10px #4b0082; border-color: #9400d3; } 50% { box-shadow: 0 0 25px #8a2be2; border-color: #ffffff; } 100% { box-shadow: 0 0 10px #4b0082; border-color: #9400d3; } }

        #merchant-popup { position: absolute; top: 100px; right: 20px; background: linear-gradient(45deg, #ffd700, #ffaa00); color: black; padding: 15px 30px; font-weight: bold; font-size: 20px; transform: skewX(-10deg); cursor: pointer; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: skewX(-10deg) scale(1); } 50% { transform: skewX(-10deg) scale(1.05); } 100% { transform: skewX(-10deg) scale(1); } }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: #0a0a0a; border: 1px solid #333; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.2s; min-height: 120px; justify-content: space-between; position: relative; }
        .card:hover { border-color: white; background: #151515; }
        .replay-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #ccc; padding: 3px 10px; border-radius: 4px; font-size: 10px; text-transform: uppercase; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .replay-btn:hover { background: white; color: black; border-color: white; }

        .breakthrough-text { color: #ff0000; font-weight: bold; font-style: italic; }
        .buffed-text { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

<div class="bg-stars" id="bg-layer"></div>

<button id="btn-biome-info" onclick="openModal('biome-info')">[ i ] BIOMES</button>

<div id="cutscene">
    <div class="star-container">
        <div class="spike vertical"></div>
        <div class="spike horizontal"></div>
        <div class="spike diag-1"></div>
        <div class="spike diag-2"></div>

    <div class="flash-bang" id="flash-bang"></div>
</div>

<div id="hud">

        <div>COINS: <span id="coins" class="val">0</span></div>
        <div>ROLLS: <span id="rolls" class="val">0</span></div>
    </div>
    <div class="stats-right">
        <div>LUCK: <span id="luck" class="val gold">x1.0</span></div>

        <div id="heaven-status" style="display:none; color: #ff00ff; font-weight:bold; text-shadow: 0 0 10px currentColor;">HEAVENLY +150K</div>
    </div>
    <div class="sidebar">
        <div style="font-size: 12px; color: #666; margin-bottom: 10px; padding-left:15px;">SYSTEM</div>
        <button class="menu-btn" onclick="openModal('index')">Index</button>
        <button class="menu-btn" onclick="openModal('craft')">Crafting</button>
        <button class="menu-btn" onclick="openModal('storage')">Storage</button>
    </div>
    <div class="center-stage">
        <div id="merchant-popup" onclick="openModal('merchant')">MERCHANT ARRIVED!</div>
        <div style="margin-bottom: 20px;">
            <div id="biome-wrapper">
                <span style="color:#aaa; font-size:12px;">BIOME:</span>
                <span id="biome-name">NORMAL</span>
            </div>

            <div id="aura-chance">1 in 2</div>

    <div class="controls">
        <button class="auto-btn" id="btn-auto" onclick="toggleAuto()">AUTO ROLL</button>
        <button class="roll-btn" id="btn-roll" onclick="clickRoll()">ROLL</button>
    </div>
</div>

<!-- MODALS -->
<div id="biome-info" class="modal-bg">
    <div class="modal">
        <div class="modal-header"><span class="modal-title">Biome Guide</span><button class="close-btn" onclick="closeModal('biome-info')">X</button></div>
        <div class="modal-body"><div id="biome-list" class="biome-list"></div></div>
    </div>
</div>

<div id="index" class="modal-bg">
    <div class="modal">
        <div class="modal-header"><span class="modal-title">Aura Index</span><button class="close-btn" onclick="closeModal('index')">X</button></div>
        <div class="modal-body"><div id="index-grid" class="grid"></div></div>
    </div>
</div>

<div id="craft" class="modal-bg">
    <div class="modal">
        <div class="modal-header"><span class="modal-title">Glove Crafting</span><button class="close-btn" onclick="closeModal('craft')">X</button></div>
        <div class="modal-body"><div style="margin-bottom:15px; color:#888;">Currently Equipped: <span id="current-glove" style="color:white; font-weight:bold;">Basic</span></div><div id="craft-list" class="craft-list"></div></div>
    </div>
</div>

<div id="storage" class="modal-bg">
    <div class="modal">
        <div class="modal-header"><span class="modal-title">Your Inventory</span><button class="close-btn" onclick="closeModal('storage')">X</button></div>
        <div class="modal-body"><div id="storage-grid" style="display:flex; flex-wrap:wrap; justify-content:center;"></div></div>
    </div>
</div>

<div id="merchant" class="modal-bg">
    <div class="modal">
        <div class="modal-header"><span class="modal-title" style="color:gold;">Traveler's Shop</span><button class="close-btn" onclick="closeModal('merchant')">X</button></div>

</div>

    ];

    const potions = [
        { id: "luck1", name: "Small Luck", luck: 1.5, time: 30, price: 50, type: "time", icon: "🧪", color: "#4caf50", desc: "x1.5 Luck (30s)" },
        { id: "luck2", name: "Medium Luck", luck: 2.0, time: 60, price: 150, type: "time", icon: "⚗️", color: "#2196f3", desc: "x2.0 Luck (60s)" },
        { id: "heaven", name: "Heavenly Potion", bonus: 150000, price: 333, type: "legendary", icon: "🌟", color: "#d4af37", desc: "+150k Luck (1 Roll)", glow: "rgba(255, 0, 255, 0.5)" },
        { id: "oblivion", name: "OBLIVION POTION", bonus: 600000, price: 5000, type: "mythical", icon: "🌌", color: "#9400d3", desc: "+600k Luck (1 Roll)", glow: "#8a2be2" }
    ];

    let data = { inv: {}, pots: { "luck1": 0, "luck2": 0, "heaven": 3, "oblivion": 8 }, coins: 100, rolls: 0, glove: 0 };
    auras.forEach(a => data.inv[a.name] = 0);

    let activePot = null;
    let heavenBuff = 0;
    let autoRolling = false;
    let autoInt = null;
    let animating = false;
    let currentBiome = biomes[0];
    let mercEnd = 0;

    // --- BIOME LOGIC ---
    function updateBiome() {
        const rand = Math.floor(Math.random() * biomes.length);
        currentBiome = biomes[rand];
        const el = document.getElementById('biome-name');
        el.innerText = currentBiome.name;
        el.style.color = currentBiome.color;
        el.style.textShadow = `0 0 10px ${currentBiome.color}`;
        document.getElementById('bg-layer').style.filter = `drop-shadow(0 0 0 ${currentBiome.color})`;
    }
    setInterval(updateBiome, 60000);
    updateBiome();

    // --- ROLL LOGIC ---
    function clickRoll() { if(!animating) doRoll(); }

    function toggleAuto() {
        autoRolling = !autoRolling;
        const btn = document.getElementById('btn-auto');
        if(autoRolling) {
            btn.classList.add('active'); btn.innerText = "AUTO: ON"; doRoll();
            autoInt = setInterval(() => { if(!animating) doRoll(); }, 500);
        } else {
            btn.classList.remove('active'); btn.innerText = "AUTO ROLL"; clearInterval(autoInt);
        }
    }

    function doRoll() {
        let luck = gloves[data.glove].luck;
        if(activePot && Date.now() < activePot.end) luck *= activePot.luck;
        else activePot = null;
        
        let finalLuck = luck + heavenBuff;
        if(heavenBuff > 0) { heavenBuff = 0; updateUI(); }

        // Calculate Effective Chance for each aura
        let pool = auras.map(a => {
            let effectiveChance = a.chance;
            let isBreakthrough = false;

            if (a.native) {
                if (currentBiome.name !== a.native) {
                    // Not in native biome -> Harder (Breakthrough)
                    effectiveChance = a.chance * (a.mult || 1);
                    isBreakthrough = true;
                } else {
                    // In native biome -> Easier (Buffed)
                    // Note: Base chance in DB is the "Normal" chance. 
                    // To represent "Native Buff", we divide the base chance.
                    // Wait, standard Sol's RNG logic: Base is Native. Outside is Multiplied.
                    // Let's stick to: Base = Normal. If Biome matches -> Divide. If Native & Biome Mismatch -> Multiply.
                    // Correction: The `native` prop implies it belongs there.
                    // If I am in "Space" and roll "Exoplanet" (native Space), chance is 40M.
                    // If I am in "Normal" and roll "Exoplanet", chance is 40M * 10 = 400M.
                    
                    // Let's use the provided logic:
                    if(currentBiome.buffs[a.name]) {
                        // Explicit buff defined in biome
                         effectiveChance = a.chance / currentBiome.buffs[a.name];
                    }
                }
            } else {
                // Non-native aura (Global), check for generic buffs
                if(currentBiome.buffs[a.name]) {
                    effectiveChance = a.chance / currentBiome.buffs[a.name];
                }
            }
            
            return { ...a, effectiveChance: effectiveChance, isBreakthrough: isBreakthrough };
        }).sort((a,b) => b.effectiveChance - a.effectiveChance); // Sort Highest Chance to Lowest

        let win = auras[0]; 
        let rand = Math.random();

        for(let a of pool) {
            // Check Probability
            // Threshold = 1 / (EffectiveChance / Luck)
            const threshold = 1 / (a.effectiveChance / finalLuck);
            if(rand < threshold) { 
                win = a; 
                break; 
            }
        }

        if(win.chance >= 1000) playCutscene(win, false, win.isBreakthrough);
        else giveReward(win, win.isBreakthrough);
    }

    function playCutscene(aura, isReplay, isBreakthrough) {
        animating = true;
        const cs = document.getElementById('cutscene');
        const text = document.getElementById('cutscene-text');
        const flash = document.getElementById('flash-bang');
        
        document.documentElement.style.setProperty('--aura-color', aura.color);
        
        cs.style.display = 'flex';
        text.className = ''; 
        
        if (isBreakthrough) {
            text.innerText = "⚠️ BREAKTHROUGH ⚠️";
            text.classList.add('breakthrough-anim');
        } else {
            text.innerText = "ROLLING...";
        }
        
        flash.classList.remove('flash-active');

        setTimeout(() => {
            flash.classList.add('flash-active');
            text.className = '';
            text.innerText = aura.name;
            text.style.color = aura.color;

            setTimeout(() => {
                cs.style.display = 'none';
                animating = false;
                if(!isReplay) {
                    giveReward(aura, isBreakthrough);
                } else {
                    displayAura(aura, isBreakthrough);
                }
            }, 500);
        }, 5500);
    }

    function displayAura(aura, isBreakthrough) {
        const n = document.getElementById('aura-name');
        n.innerText = aura.name;
        n.style.color = aura.color;
        n.style.textShadow = `0 0 30px ${aura.color}`;
        
        let cText = "";
        let finalChance = aura.chance;
        
        if (aura.native && currentBiome.name !== aura.native) {
             finalChance = aura.chance * (aura.mult || 1);
             cText = `1 in ${finalChance.toLocaleString()}`;
             if(isBreakthrough) cText += " (BREAKTHROUGH!)";
        } else if (currentBiome.buffs[aura.name]) {
             finalChance = aura.chance / currentBiome.buffs[aura.name];
             cText = `1 in ${finalChance.toLocaleString()} (Biome Buff)`;
        } else {
             cText = `1 in ${finalChance.toLocaleString()}`;
        }

        const cEl = document.getElementById('aura-chance');
        cEl.innerText = cText;
        if(isBreakthrough) cEl.className = 'breakthrough-text';
        else if(currentBiome.buffs[aura.name]) cEl.className = 'buffed-text';
        else cEl.className = '';
    }

    function giveReward(aura, isBreakthrough) {
        data.inv[aura.name]++; data.rolls++; data.coins++;
        displayAura(aura, isBreakthrough);
        updateUI();
    }

    function updateUI() {
        document.getElementById('coins').innerText = data.coins;
        document.getElementById('rolls').innerText = data.rolls;
        document.getElementById('current-glove').innerText = gloves[data.glove].name;

        let luck = gloves[data.glove].luck;
        if(activePot && Date.now() < activePot.end) luck *= activePot.luck;
        
        let txt = "x" + luck.toFixed(1);
        const status = document.getElementById('heaven-status');
        if(heavenBuff > 0) {
            status.style.display = 'block';
            let name = heavenBuff >= 600000 ? "VOID" : "HEAVENLY";
            status.style.color = heavenBuff >= 600000 ? "#a020f0" : "#ff00ff";
            status.innerText = `${name} +${(heavenBuff/1000).toFixed(0)}K`;
            txt += ` (+${heavenBuff})`;
        } else {
            status.style.display = 'none';
        }
        document.getElementById('luck').innerText = txt;
        
        const timer = document.getElementById('buff-timer');
        if(activePot) timer.innerText = `${activePot.name}: ${Math.ceil((activePot.end - Date.now())/1000)}s`;
        else timer.innerText = "";
    }

    // --- MODALS ---
    function openModal(id) { document.getElementById(id).style.display = 'flex'; if(id==='index')renderIndex(); if(id==='craft')renderCraft(); if(id==='storage')renderStorage(); if(id==='merchant')renderMerc(); if(id==='biome-info')renderBiomeInfo(); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function triggerReplay(n) { const a = auras.find(x=>x.name===n); if(a){ closeModal('index'); playCutscene(a, true, false); } }

    function renderBiomeInfo() {
        const list = document.getElementById('biome-list');
        list.innerHTML = "";
        biomes.forEach(b => {
            let buffHtml = "";
            for (let [aura, val] of Object.entries(b.buffs)) {
                buffHtml += `<div class="buff-item"><span class="buff-aura">${aura}</span><span class="buff-val">x${val} rate</span></div>`;
            }
            if(buffHtml === "") buffHtml = "<div style='color:#666; font-size:12px;'>No specific aura buffs.</div>";

            const div = document.createElement('div');
            div.className = 'biome-card';
            div.innerHTML = `<h3 style="color:${b.color}">${b.name}</h3>${buffHtml}`;
            list.appendChild(div);
        });
    }

    function renderIndex() {
        const g = document.getElementById('index-grid'); g.innerHTML = "";
        auras.forEach(a => {
            const c = data.inv[a.name];
            const div = document.createElement('div');
            div.className = `card ${c===0?'locked':''}`;
            let btn = (a.chance >= 1000 && c > 0) ? `<button class="replay-btn" onclick="triggerReplay('${a.name}')">▶ Replay</button>` : '';
            
            let displayChance = a.chance;
            let note = "";
            if (currentBiome.buffs[a.name]) {
                 displayChance = a.chance / currentBiome.buffs[a.name];
                 note = `<div style="font-size:10px; color:#4f4;">Biome Buff!</div>`;
            }

            div.innerHTML = `
                <strong style="color:${c?a.color:'#555'}">${c?a.name:'???'}</strong>
                <small>1 in ${displayChance.toLocaleString()}</small>
                ${note}
                <div>x${c}</div>${btn}
            `;
            g.appendChild(div);
        });
    }

    function renderCraft() {
        const list = document.getElementById('craft-list'); list.innerHTML = "";
        gloves.forEach((gl, i) => {
            const owned = data.glove >= i;
            let reqsHTML = "";
            if(i === 0) reqsHTML = "<span class='req-chip req-ok'>Free</span>";
            else {
                for(let [k,v] of Object.entries(gl.cost)) {
                    const have = data.inv[k];
                    reqsHTML += `<span class='req-chip ${have>=v?'req-ok':'req-no'}'>${k} ${have}/${v}</span>`;
                }
            }
            const div = document.createElement('div'); div.className = 'craft-row';
            div.innerHTML = `
                <div class="craft-icon" style="box-shadow: 0 0 10px ${owned?'#4f4':'#888'}">🧤</div>
                <div class="craft-info"><div class="craft-name">${gl.name}</div><div class="craft-buff">x${gl.luck}</div><div class="craft-reqs">${reqsHTML}</div></div>
                <button class="craft-btn ${owned?'craft-owned':''}" onclick="doCraft(${i})" ${owned&&data.glove!==i?'' : (owned?'disabled':'')}>${owned?(data.glove===i?'Equipped':'Equip'):'CRAFT'}</button>
            `;
            if(owned && data.glove !== i) { div.querySelector('button').onclick = function(){ data.glove = i; renderCraft(); updateUI(); }; }
            list.appendChild(div);
        });
    }
    function doCraft(i) {
        let g = gloves[i]; let ok = true;
        for(let [k,v] of Object.entries(g.cost)) if(data.inv[k] < v) ok = false;
        if(ok) { for(let [k,v] of Object.entries(g.cost)) data.inv[k] -= v; data.glove = i; renderCraft(); updateUI(); }
    }

    function renderStorage() {
        const g = document.getElementById('storage-grid'); g.innerHTML = "";
        potions.forEach(p => {
            const count = data.pots[p.id];
            const div = document.createElement('div');
            let cls = p.type === 'legendary' ? 'legendary' : (p.type==='mythical'?'mythical':'');
            div.className = `inv-item ${cls}`;
            div.style.setProperty('--item-color', p.color);
            div.style.setProperty('--item-color-glow', p.glow || p.color);
            div.innerHTML = `<div class="inv-badge">x${count}</div><div class="inv-icon">${p.icon}</div><div class="inv-name">${p.name}</div><div class="inv-desc">${p.desc}</div><button class="inv-btn" onclick="usePot('${p.id}')" ${count<1?'disabled':''}>${count<1?'Empty':'Use'}</button>`;
            g.appendChild(div);
        });
    }
    function usePot(id) {
        if(data.pots[id] > 0) {
            data.pots[id]--; let p = potions.find(x=>x.id===id);
            if(p.type==='time') activePot = { name:p.name, luck:p.luck, end:Date.now()+p.time*1000 };
            else { heavenBuff = p.bonus; alert(id==='oblivion'?"VOID GAZES BACK...":"HEAVENLY ENERGY!"); }
            renderStorage(); updateUI();
        }
    }

    function renderMerc() {
        const g = document.getElementById('merc-grid'); g.innerHTML = "";
        potions.forEach(p => {
            const div = document.createElement('div'); div.className = 'card';
            div.innerHTML = `<strong>${p.name}</strong><div style="color:gold">${p.price} Coins</div><button onclick="buy('${p.id}')" style="cursor:pointer;">BUY</button>`;
            g.appendChild(div);
        });
    }
    function buy(id) { let p = potions.find(x=>x.id===id); if(data.coins>=p.price) { data.coins-=p.price; data.pots[id]++; renderMerc(); updateUI(); } }

    setInterval(() => {
        const pop = document.getElementById('merchant-popup');
        if(pop.style.display==='none' && Math.random()<0.2) {
            pop.style.display='block'; mercEnd=Date.now()+60000;
            let t = setInterval(()=>{ 
                let l = Math.ceil((mercEnd-Date.now())/1000); 
                if(l<=0){clearInterval(t);pop.style.display='none';closeModal('merchant');} 
                document.getElementById('merc-time').innerText=l; 
            },1000);
        }
    }, 10000);
    setInterval(updateUI, 1000);
    updateUI();
</script>
</body>
